<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0C10"/>
  
  <!-- Subtle gradient mesh glow -->
  <radialGradient id="ogGlow" cx="20%" cy="20%" r="60%">
    <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="#222634" stroke-width="1.5"/>

  <!-- Brand Logo -->
  <rect x="80" y="80" width="48" height="48" rx="12" fill="#141722" stroke="#2B3247" stroke-width="1.5"/>
  <text x="92" y="112" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">MS</text>
  <circle cx="120" cy="110" r="3" fill="#3B82F6"/>

  <!-- Status Pill -->
  <rect x="150" y="88" width="180" height="32" rx="16" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.3"/>
  <circle cx="168" cy="104" r="4" fill="#10B981"/>
  <text x="182" y="109" fill="#34D399" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AVAILABLE FOR ROLES</text>

  <!-- Main Headline -->
  <text x="80" y="240" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" letter-spacing="-1.5">Manas Singh</text>
  <text x="80" y="310" fill="#9CA3AF" font-family="serif" font-style="italic" font-size="44" font-weight="400">Fullstack Engineer &amp; Product Builder</text>

  <!-- Bio -->
  <text x="80" y="370" fill="#6B7280" font-family="system-ui, sans-serif" font-size="20" font-weight="300">Architecting end-to-end web applications with clean systems, intentional motion, and zero fluff.</text>

  <!-- Tech Stack Badges -->
  <g transform="translate(80, 440)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="90" height="36" rx="6" fill="#161924" stroke="#282E40"/>
    <text x="18" y="23" fill="#E5E7EB" font-family="monospace" font-size="13">React</text>

    <!-- Badge 2 -->
    <rect x="106" y="0" width="124" height="36" rx="6" fill="#161924" stroke="#282E40"/>
    <text x="122" y="23" fill="#E5E7EB" font-family="monospace" font-size="13">TypeScript</text>

    <!-- Badge 3 -->
    <rect x="246" y="0" width="104" height="36" rx="6" fill="#161924" stroke="#282E40"/>
    <text x="262" y="23" fill="#E5E7EB" font-family="monospace" font-size="13">Next.js</text>

    <!-- Badge 4 -->
    <rect x="366" y="0" width="104" height="36" rx="6" fill="#161924" stroke="#282E40"/>
    <text x="382" y="23" fill="#E5E7EB" font-family="monospace" font-size="13">Node.js</text>

    <!-- Badge 5 -->
    <rect x="486" y="0" width="114" height="36" rx="6" fill="#161924" stroke="#282E40"/>
    <text x="502" y="23" fill="#E5E7EB" font-family="monospace" font-size="13">MongoDB</text>
  </g>

  <!-- Footer URL -->
  <text x="80" y="540" fill="#4B5563" font-family="monospace" font-size="15">jaipur, in · manasdotio@gmail.com</text>
  <text x="1000" y="540" fill="#60A5FA" font-family="monospace" font-size="15" text-anchor="end">manassingh.dev ↗</text>
